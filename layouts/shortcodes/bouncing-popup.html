{{ $title := .Get "title" | default "games.exe" }}
<a class="bouncing-popup window" href="{{ .Get "href" }}">
  <div class="title-bar">
    <span class="title-bar-text">{{ $title }}</span>
    <button class="title-bar-close" type="button" aria-label="Close">×</button>
  </div>
  <div class="window-body">{{ .Inner | markdownify }}</div>
</a>
